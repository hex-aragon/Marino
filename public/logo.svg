<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4aa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Radar pulse rings -->
  <circle cx="256" cy="256" r="180" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.2" fill="none"/>
  <circle cx="256" cy="256" r="130" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <circle cx="256" cy="256" r="80" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5" fill="none"/>

  <!-- Radar sweep -->
  <path d="M 256 256 L 256 76 A 180 180 0 0 1 405 165 Z" fill="url(#pulse)" opacity="0.4"/>

  <!-- Ocean waves at bottom -->
  <path d="M 60 360 Q 120 340 180 360 T 300 360 T 420 360 T 460 360 L 460 380 Q 400 400 340 380 T 220 380 T 100 380 T 60 380 Z" fill="url(#accent)" opacity="0.3"/>
  <path d="M 60 390 Q 120 370 180 390 T 300 390 T 420 390 T 460 390 L 460 410 Q 400 430 340 410 T 220 410 T 100 410 T 60 410 Z" fill="url(#accent)" opacity="0.2"/>

  <!-- Ship silhouette -->
  <g transform="translate(256, 270)">
    <!-- Hull -->
    <path d="M -80 30 L 80 30 L 65 60 L -65 60 Z" fill="url(#accent)"/>
    <!-- Deck superstructure -->
    <rect x="-45" y="0" width="90" height="32" fill="url(#accent)"/>
    <rect x="-25" y="-20" width="50" height="22" fill="url(#accent)"/>
    <!-- Mast -->
    <rect x="-2" y="-55" width="4" height="38" fill="url(#accent)"/>
    <!-- Antenna dot (AI signal) -->
    <circle cx="0" cy="-58" r="6" fill="#00d4aa"/>
    <circle cx="0" cy="-58" r="12" fill="#00d4aa" opacity="0.3"/>
    <!-- Windows -->
    <rect x="-38" y="8" width="6" height="6" fill="#0a1628"/>
    <rect x="-22" y="8" width="6" height="6" fill="#0a1628"/>
    <rect x="-6" y="8" width="6" height="6" fill="#0a1628"/>
    <rect x="10" y="8" width="6" height="6" fill="#0a1628"/>
    <rect x="26" y="8" width="6" height="6" fill="#0a1628"/>
  </g>

  <!-- AI nodes (corner pulses) -->
  <circle cx="120" cy="120" r="4" fill="#00d4aa"/>
  <circle cx="120" cy="120" r="10" fill="#00d4aa" opacity="0.3"/>
  <circle cx="392" cy="120" r="4" fill="#00d4aa"/>
  <circle cx="392" cy="120" r="10" fill="#00d4aa" opacity="0.3"/>
  <circle cx="392" cy="392" r="4" fill="#00d4aa"/>
  <circle cx="392" cy="392" r="10" fill="#00d4aa" opacity="0.3"/>
  <circle cx="120" cy="392" r="4" fill="#00d4aa"/>
  <circle cx="120" cy="392" r="10" fill="#00d4aa" opacity="0.3"/>

  <!-- Wordmark -->
  <text x="256" y="465" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SeaWatch</text>
</svg>
